[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-memory-os"
version = "1.1.0"
description = "An open, portable memory layer shared across AI assistants."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "massuru-mi"}]
dependencies = ["PyYAML>=6.0.2"]
keywords = ["ai", "memory", "obsidian", "markdown", "personal-knowledge-management"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
pmo = "personal_memory_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_memory_os = ["system/**/*.md", "system/**/*.yaml", "system/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
